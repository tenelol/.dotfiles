<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="denix ベースの dotfiles 構成をグラフで探索するローカルビュー"
    />
    <title>Dotfiles Graph</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">❄</span>
        <strong>nix · dotfiles</strong>
        <span>graph</span>
      </div>

      <label class="global-search">
        <span aria-hidden="true">⌕</span>
        <input
          id="search-input"
          type="search"
          placeholder="ノードを検索"
          autocomplete="off"
          aria-label="ノードを検索"
        />
        <kbd>/</kbd>
      </label>

      <div class="topbar-status">
        <span id="target-chip" class="target-chip">target を検出中</span>
        <span id="git-chip" class="git-chip">Git を確認中</span>
        <span id="sync-status" class="sync-status" aria-live="polite">
          <i></i> connecting
        </span>
      </div>
    </header>

    <main id="graph-shell" class="graph-shell">
      <canvas
        id="graph-canvas"
        tabindex="0"
        aria-label="dotfiles 構成グラフ。ドラッグで移動、ホイールで拡大縮小できます。"
      ></canvas>

      <aside class="control-panel" aria-label="グラフ表示設定">
        <div class="panel-heading">
          <div>
            <span class="panel-kicker">VISIBLE LAYERS</span>
            <strong>表示するもの</strong>
          </div>
          <span id="visible-count" class="visible-count">—</span>
        </div>

        <div id="filter-list" class="filter-list"></div>

        <div class="panel-divider"></div>

        <div class="legend">
          <span><i class="legend-dot active"></i>現在使用中</span>
          <span><i class="legend-ring"></i>選択中</span>
          <span><i class="legend-line"></i>構成上の接続</span>
        </div>

        <p class="gesture-hint">
          drag to pan · scroll to zoom<br />
          node drag · click to inspect
        </p>
      </aside>

      <aside
        id="inspector"
        class="inspector"
        aria-label="選択ノードの詳細"
        aria-live="polite"
      >
        <div class="inspector-empty">
          <span>SELECT A NODE</span>
          <strong>グラフから構成要素を選択</strong>
          <p>接続先と設定元をここで確認できます。</p>
        </div>
      </aside>

      <div class="graph-toolbar" role="toolbar" aria-label="グラフ操作">
        <button id="zoom-out" type="button" aria-label="縮小">−</button>
        <button id="zoom-label" class="zoom-label" type="button">100%</button>
        <button id="zoom-in" type="button" aria-label="拡大">＋</button>
        <span></span>
        <button id="fit-graph" type="button">全体表示</button>
        <button id="toggle-labels" type="button" aria-pressed="true">
          ラベル
        </button>
        <button id="toggle-motion" type="button" aria-pressed="true">
          動き
        </button>
      </div>

      <div id="graph-stats" class="graph-stats">— nodes · — links</div>
      <div id="error-banner" class="error-banner" hidden></div>
      <div id="accessible-nodes" class="sr-only" aria-live="polite"></div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
