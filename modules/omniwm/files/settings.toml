[appearance]
tabRailAppIcons = true

[borders]
width = 2.0

[borders.glow]
enabled = true
opacity = 0.7000000000000001
radius = 19.0

[focus]
crossesMonitorAtEdge = true
followsMouse = true
followsWindowToMonitor = true
moveCrossesMonitorAtEdge = true
moveMouseToFocusedWindow = true

[general]
animationSpeed = 0.25
ipcEnabled = true
preventSleepEnabled = true

[gestures]
overviewGestureEnabled = true
workspaceSwipeEnabled = true

[island]
enabled = true

[niri]
infiniteLoop = true
singleWindowFit = "container_primary_span"

[quakeTerminal]
animationDuration = 0.30000000000000004
autoHide = true
backgroundBlurRadius = 100
backgroundEffect = "glassClear"
heightPercent = 80.0
opacity = 0.6
widthPercent = 80.0

[windowSwitcher]
enabled = true

[workspaceBar]
autoHide = true
backgroundOpacity = 0.0
deduplicateAppIcons = true
height = 40.0
hideEmptyWorkspaces = true
hideInNativeFullscreen = true
notchMode = "off"
position = "bottom"
showFloatingWindows = true
showLabels = false
transparentBackground = true

