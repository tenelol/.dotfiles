#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# Yazi is a narrow navigator in the left Herdr pane, so only keep the current
# directory visible. Zoom the pane when a wider file operation is needed.
ratio = [ 0, 1, 0 ]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 3
