<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- LibreOffice's headless backend uses its bundled fontconfig, which has no
     macOS font directories without this file. -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- Office documents from Japanese Windows name fonts that macOS lacks. -->
  <match target="pattern">
    <test name="family" compare="contains"><string>ゴシック</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Hiragino Sans</string>
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>明朝</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Hiragino Mincho ProN</string>
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Hiragino Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
