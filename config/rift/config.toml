[settings]
animate = true
animation_duration = 3.0
animation_fps = 100.0
default_disable = false

focus_follows_mouse = true
focus_follows_mouse_disable_hotkey = "Alt"
mouse_follows_focus = true
mouse_hides_on_focus = false
auto_focus_blacklist = [
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
  "com.apple.Spotlight",
  "com.raycast.macos",
]
run_on_start = [
  "/bin/sh -lc \"$HOME/.config/rift/sketchybar-workspace-subscribe\"",
]
hot_reload = true

[settings.layout]
mode = "scrolling"

[settings.layout.master_stack]
master_ratio = 0.6
master_count = 1
master_side = "left"
new_window_placement = "master"

[settings.layout.scrolling]
animate = true
column_width_ratio = 0.7
min_column_width_ratio = 0.3
max_column_width_ratio = 0.9
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
enabled = false
invert_horizontal = false
vertical_tolerance = 0.4
fingers = 3
distance_pct = 0.08
propagate_to_workspace_swipe = false
workspace_switch_threshold = 0.625

[settings.layout.stack]
stack_offset = 40.0
default_orientation = "perpendicular"

[settings.layout.gaps.outer]
top = 38
left = 10
bottom = 20
right = 10

[settings.layout.gaps.inner]
horizontal = 6
vertical = 6

[settings.ui.menu_bar]
enabled = false
show_empty = false
mode = "active"
active_label = "index"
display_style = "label"

[settings.ui.stack_line]
enabled = false
horiz_placement = "top"
vert_placement = "left"
thickness = 20.0
spacing = 1.0

[settings.ui.mission_control]
enabled = false
fade_enabled = false
fade_duration_ms = 180.0

[settings.gestures]
enabled = true
invert_horizontal_swipe = false
swipe_vertical_tolerance = 0.4
skip_empty = false
fingers = 3
distance_pct = 0.08
haptics_enabled = true
haptic_pattern = "level_change"

[settings.window_snapping]
drag_swap_fraction = 0.3

[virtual_workspaces]
enabled = true
default_workspace_count = 5
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
reapply_app_rules_on_title_change = false
workspace_rules = []
default_workspace = 0
workspace_names = [
  "1",
  "2",
  "3",
  "4",
  "5",
]

app_rules = [
  { app_id = "com.anthropic.claudefordesktop", workspace = 0 },
  { app_id = "com.mitchellh.ghostty", workspace = 0 },
  { app_id = "com.openai.codex", workspace = 0 },
  { app_id = "company.thebrowser.dia", workspace = 1 },
  { app_id = "com.tinyspeck.slackmacgap", workspace = 2 },
  { app_id = "dev.vencord.vesktop", workspace = 2 },
  { app_id = "jp.naver.line.mac", workspace = 2 },
  { app_id = "com.spotify.client", workspace = 3 },
  { app_name = "System Settings", manage = false },
  { app_name = "System Preferences", manage = false },
  { app_name = "App Store", manage = false },
  { app_name = "Calculator", manage = false },
  { app_name = "Finder", title_regex = "^(Copy|Move|Info|Preferences)", manage = false },
]

[modifier_combinations]
move = "Alt + Shift"
join = "Alt + Ctrl"
display_move = "Alt + Ctrl + Shift"

[keys]
"Alt + Enter" = { exec = ["/bin/bash", "-c", "open -a Ghostty"] }

"Alt + Slash" = { set_workspace_layout = { mode = "scrolling" } }
"Alt + B" = { set_workspace_layout = { mode = "bsp" } }
"Alt + M" = { set_workspace_layout = { mode = "master_stack" } }
"Alt + Comma" = { set_workspace_layout = { mode = "stack" } }
"Alt + Period" = { set_workspace_layout = { mode = "traditional" } }
"Alt + Ctrl + Left" = { scroll_strip = { delta = -0.5 } }
"Alt + Ctrl + Right" = { scroll_strip = { delta = 0.5 } }
"Alt + Ctrl + Down" = "snap_strip"
"Alt + Ctrl + Up" = "center_selection"

"Alt + H" = { move_focus = "left" }
"Alt + J" = { move_focus = "down" }
"Alt + K" = { move_focus = "up" }
"Alt + L" = { move_focus = "right" }
"Alt + Left" = { move_focus = "left" }
"Alt + Down" = { move_focus = "down" }
"Alt + Up" = { move_focus = "up" }
"Alt + Right" = { move_focus = "right" }

"move + H" = { move_node = "left" }
"move + J" = { move_node = "down" }
"move + K" = { move_node = "up" }
"move + L" = { move_node = "right" }

"join + H" = { join_window = "left" }
"join + J" = { join_window = "down" }
"join + K" = { join_window = "up" }
"join + L" = { join_window = "right" }

"Alt + Minus" = "resize_window_shrink"
"Alt + Equal" = "resize_window_grow"

"Alt + 1" = { switch_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }

"move + 1" = { move_window_to_workspace = 0 }
"move + 2" = { move_window_to_workspace = 1 }
"move + 3" = { move_window_to_workspace = 2 }
"move + 4" = { move_window_to_workspace = 3 }
"move + 5" = { move_window_to_workspace = 4 }

"Alt + Tab" = "switch_to_last_workspace"
"Alt + Shift + Tab" = "next_workspace"
"Alt + U" = "prev_workspace"
"Alt + I" = "next_workspace"
"Alt + Shift + Space" = "toggle_window_floating"
"Alt + Shift + X" = "toggle_orientation"
"Alt + Shift + F" = "toggle_fullscreen_within_gaps"

"Alt + Shift + Left" = { focus_display = "left" }
"Alt + Shift + Right" = { focus_display = "right" }

"display_move + H" = { move_window_to_display = { selector = "left" } }
"display_move + L" = { move_window_to_display = { selector = "right" } }
"display_move + Left" = { move_window_to_display = { selector = "left" } }
"display_move + Right" = { move_window_to_display = { selector = "right" } }
