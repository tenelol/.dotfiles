#:schema https://yazi-rs.github.io/schemas/theme.json

# Match config/nvim/lua/core/theme.lua: graphite gray with restrained cool accents.
[app]
overall = { fg = "#B3BBC7", bg = "reset" }

[mgr]
cwd = { fg = "#7F9BC4", bold = true }
find_keyword = { fg = "#D8DDE6", bg = "#293448", bold = true }
find_position = { fg = "#5F7695", bold = true }
symlink_target = { fg = "#626C7A", italic = true }
marker_copied = { fg = "#88C0B8", bg = "#88C0B8" }
marker_cut = { fg = "#A894C7", bg = "#A894C7" }
marker_marked = { fg = "#5F7695", bg = "#5F7695" }
marker_selected = { fg = "#A8B4CE", bg = "#A8B4CE" }
border_symbol = "│"
border_style = { fg = "#4F5968" }

[tabs]
active = { fg = "#D8DDE6", bg = "#293448", bold = true }
inactive = { fg = "#626C7A", bg = "reset" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = " ", close = " " }

[mode]
normal_main = { fg = "#11151D", bg = "#7F9BC4", bold = true }
normal_alt = { fg = "#7F9BC4", bg = "#202631" }
select_main = { fg = "#11151D", bg = "#A894C7", bold = true }
select_alt = { fg = "#A894C7", bg = "#202631" }
unset_main = { fg = "#11151D", bg = "#94B8C7", bold = true }
unset_alt = { fg = "#94B8C7", bg = "#202631" }

[indicator]
parent = { fg = "#8993A3", bg = "#202631" }
current = { fg = "#D8DDE6", bg = "#293448", bold = true }
preview = { fg = "#5F7695", underline = true }
padding = { open = " ", close = " " }

[status]
overall = { fg = "#8993A3" }
sep_left = { open = " ", close = "" }
sep_right = { open = "", close = " " }
perm_sep = { fg = "#4F5968" }
perm_type = { fg = "#7F9BC4" }
perm_read = { fg = "#B3BBC7" }
perm_write = { fg = "#A894C7" }
perm_exec = { fg = "#5F7695" }
progress_label = { fg = "#B3BBC7", bold = true }
progress_normal = { fg = "#5F7695", bg = "#202631" }
progress_error = { fg = "#C4A0E8", bg = "#202631" }

[filetype]
rules = [
	{ url = "*/", fg = "#8993A3" },
	{ url = "*", fg = "#8993A3" },
]

# Drop the vivid built-in directory icons and keep every directory on the same
# restrained blue used by the rest of the interface.
[icon]
dirs = []
prepend_conds = [
	{ if = "dir & hovered", text = "", fg = "#5F7695" },
	{ if = "dir", text = "", fg = "#5F7695" },
]
