#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# The parent pane becomes unreadable in narrow Herdr splits. Keep the current
# directory and preview useful without reducing the terminal font size.
ratio = [ 0, 5, 3 ]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 3

[preview]
wrap = "yes"
tab_size = 2
