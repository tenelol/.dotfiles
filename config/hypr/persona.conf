# Persona rice for Hyprland.

monitor = DP-3,3840x2160@75,0x0,1.5
monitor = HDMI-A-1,1920x1080@164.995,2560x540,1
monitor = ,preferred,auto,1

env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = DESKTOP_SESSION,hyprland

exec-once = dbus-update-activation-environment --systemd XDG_CURRENT_DESKTOP=Hyprland XDG_SESSION_TYPE=wayland DESKTOP_SESSION=hyprland WAYLAND_DISPLAY DISPLAY HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DESKTOP_SESSION WAYLAND_DISPLAY DISPLAY HYPRLAND_INSTANCE_SIGNATURE
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = fcitx5 -d
exec-once = kdeconnect-indicator
exec-once = persona-quickshell-session start

input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    repeat_rate = 40
    repeat_delay = 250

    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(1479ffff) rgba(ea1f4dff) 45deg
    col.inactive_border = rgba(202020aa)
    layout = dwindle
}

decoration {
    rounding = 2

    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = persona, 0.13, 0.88, 0.18, 1
    animation = windows, 1, 5, persona, popin 80%
    animation = windowsOut, 1, 4, persona, popin 80%
    animation = fade, 1, 5, default
    animation = border, 1, 8, default
    animation = workspaces, 1, 5, persona, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

$mainMod = ALT
$terminal = ghostty

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, R, exec, persona-quickshell-session search
bind = $mainMod, Space, exec, persona-quickshell-session search
bind = $mainMod SHIFT, R, exec, persona-quickshell-session restart
bindr = SUPER, Super_L, exec, fcitx5-remote -t
bindr = SUPER, Super_R, exec, fcitx5-remote -t
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, E, exit

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
