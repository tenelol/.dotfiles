config-version = 2

after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/sketchybar --trigger workspace_change REFRESH=all',
]
start-at-login = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ['1', '2', '3', '4', '5']

exec-on-workspace-change = [
  '/bin/bash',
  '-lc',
  '/opt/homebrew/bin/sketchybar --trigger workspace_change FOCUSED="$AEROSPACE_FOCUSED_WORKSPACE" PREVIOUS="$AEROSPACE_PREV_WORKSPACE"',
]

[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/run/current-system/sw/bin:/usr/bin:/bin:/usr/sbin:/sbin'

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 6
outer.bottom = 6
outer.top = 44
outer.right = 6

[key-mapping]
preset = 'qwerty'

[mode.main.binding]
alt-enter = 'exec-and-forget open -a Ghostty'

alt-slash = 'layout tiles'
alt-b = 'layout accordion'
alt-m = 'layout h_tiles'
alt-comma = 'layout v_accordion'
alt-period = 'layout h_accordion'
alt-ctrl-left = 'workspace --wrap-around prev'
alt-ctrl-right = 'workspace --wrap-around next'
alt-ctrl-down = 'layout tiles'
alt-ctrl-up = 'balance-sizes'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'workspace --wrap-around next'
alt-u = 'workspace --wrap-around prev'
alt-i = 'workspace --wrap-around next'
alt-shift-space = 'layout floating tiling'
alt-shift-x = 'layout horizontal vertical'
alt-shift-f = 'fullscreen'

alt-shift-left = 'focus-monitor left'
alt-shift-right = 'focus-monitor right'

alt-ctrl-shift-h = 'move-node-to-monitor --focus-follows-window left'
alt-ctrl-shift-l = 'move-node-to-monitor --focus-follows-window right'
alt-ctrl-shift-left = 'move-node-to-monitor --focus-follows-window left'
alt-ctrl-shift-right = 'move-node-to-monitor --focus-follows-window right'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = '^(Copy|Move|Info|Preferences)'
run = 'layout floating'
