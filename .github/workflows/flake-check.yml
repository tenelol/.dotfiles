name: Flake Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Restore Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check Nix formatting
        run: nix fmt -- flake.nix hosts modules rices packages --ci --excludes 'hosts/*/hardware-configuration.nix'

      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build

  linux-build-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - build-adguard-home
          - build-surface
          - build-nvidia-desktop
          - build-web-server
          - build-nas
          - build-wsl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Restore Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Linux flake check
        run: nix build .#checks.x86_64-linux.${{ matrix.check }}
