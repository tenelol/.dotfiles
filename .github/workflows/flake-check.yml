name: Flake Check

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "home/**"
      - "lib/**"
      - "rices/**"
      - "config/**"
      - "packages/**"
      - "scripts/**"
      - "vendor/**"
      - "img/**"
      - "keys/**"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "home/**"
      - "lib/**"
      - "rices/**"
      - "config/**"
      - "packages/**"
      - "scripts/**"
      - "vendor/**"
      - "img/**"
      - "keys/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check Nix formatting
        run: nix fmt -- flake.nix hosts modules rices home packages lib --ci --excludes 'hosts/*/hardware-configuration.nix' --excludes 'legacy/**'

      - name: Evaluate all supported systems
        run: ./scripts/validate eval

  linux-build-checks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - build-nixos
          - build-nvidia-desktop
          - build-nixos-server
          - build-wsl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build Linux flake check
        run: nix build .#checks.x86_64-linux.${{ matrix.check }}
