name: Flake Check

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "home/**"
      - "config/**"
      - "packages/**"
      - "vendor/**"
      - "img/**"
      - "keys/**"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "home/**"
      - "config/**"
      - "packages/**"
      - "vendor/**"
      - "img/**"
      - "keys/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check Nix formatting
        run: nix fmt -- flake.nix hosts modules home packages --ci --excludes 'hosts/*/hardware-configuration.nix' --excludes 'legacy/**'

      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build
